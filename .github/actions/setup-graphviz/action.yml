name: Set up Graphviz
description: 'Install Graphviz (including dot)'

# Examples in case of future need.
# Define inputs that callers can provide
#inputs:
#  graphviz_version:
#    description: 'Graphviz version to install'
#    required: false
#    default: '2.43'

# Define outputs to pass data back to the caller
#outputs:
#
# cache-hit:
#    description: 'Whether npm cache was hit'
#    value: ${{ steps.npm-cache.outputs.cache-hit }}

# The composite run steps
runs:
  using: 'composite'
  steps:
    - name: "Install Graphviz (Linux)"
      #if: ${{ inputs.graphviz == 'true' && runner.os == 'Linux' }}
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes graphviz

    - name: "Install Graphviz (macOS)"
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: brew install graphviz
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"

    - name: "Install Graphviz (Windows)"
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      # choco or GitHub's networks have proved to be unreliable.
      # Due to https://github.com/chocolatey/choco/issues/1609 choco does not set the exit
      # code on certain errors. Therefore we cannot rely on it.
      run: |
        $ErrorActionPreference = "Continue"
        $retryCount = 4
        $success = $false
        for ($i = 1; $i -le $retryCount; $i++) {
            Write-Host "Attempt no: $i"
            choco upgrade graphviz --yes --no-progress
            $installed = choco list --exact --limit-output graphviz
            if ($installed) {
                $success = $true
                Write-Host "Installation successful: $installed"
                break
            } else {
                Write-Host "Installation failed. Retrying..."
                Start-Sleep -Seconds (2*$i)
            }
        }
        if (-not $success) {
            Write-Host "Installation failed after $retryCount attempts."
            exit 1
        }
    - name: "Check Graphviz installation"
      #if: ${{ inputs.graphviz == 'true' }}
      shell: bash
      run: dot -V
