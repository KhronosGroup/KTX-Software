name: Fuzz libktx

# Seems no way to avoid duplicating this logic in each .yml file.
# See https://github.com/actions/starter-workflows/issues/245.
on:
  # Trigger the workflow on a pull request,
  pull_request:

  push:
    # And on pushes to main, which will occur when a PR is merged.
    branches:
      - main
    # Also trigger on push of release tags to any branch. Useful
    # for testing release builds before merging to main.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
    paths-ignore:
      - .appveyor.yml
      - .github/workflows/android.yml
      - .github/workflows/check-determinism.yml
      - .github/workflows/check-libktx-only.yml
      - .github/workflows/check-mkvk.yml
      - .github/workflows/check-reuse.yml
      - .github/workflows/docs.yml
      - .github/workflows/formatting.yml
      - .github/workflows/linux.yml
      - .github/workflows/mingw.yml
      - .github/workflows/macos.yml
      - .github/workflows/publish-pyktx.yml
      - .github/workflows/pyktx.yml
      - .github/workflows/manual.yml
      - .github/workflows/web.yml
      - .github/workflows/windows.yml
      - .travis.yml
      - README.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - LICENSE.md
      - LICENSES
      - RELEASE_NOTES.md
      - REUSE.toml
      - install-gitconfig*
  # Allow manual trigger
  workflow_dispatch:

jobs:
  fuzz:
    # libFuzzer needs Clang and a build instrumented for it, so this is a
    # workflow of its own rather than part of the ASan job in linux.yml.
    # See tests/fuzz/README.md.
    name: Fuzz ${{ matrix.target }} (Clang, ASan+UBSan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Let every target run its 10 minutes when another finds something.
      fail-fast: false
      matrix:
        target: [ktx_read_fuzzer, ktx_info_fuzzer, ktx_validate_fuzzer]
    env:
      GIT_LFS_SKIP_SMUDGE: 1
      FUZZ_BUILD_DIR: build/fuzz
      # Report the stack of an UndefinedBehaviorSanitizer error, not only
      # its file and line.
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v6
        with:
          # libktx derives its version from the tags.
          fetch-depth: 0

      - name: Fetch the seed files from LFS
        run: git lfs pull --include="tests/resources/ktx,tests/resources/ktx2"

      - name: Build the fuzz target
        run: |
          cmake -S tests/fuzz -B $FUZZ_BUILD_DIR \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build $FUZZ_BUILD_DIR --target ${{ matrix.target }} --parallel

      - name: Fuzz for 10 minutes
        id: fuzz10
        # bash -o pipefail, so that the step fails when the fuzzer does.
        shell: bash
        run: |
          mkdir -p $FUZZ_BUILD_DIR/corpus $FUZZ_BUILD_DIR/seeds $FUZZ_BUILD_DIR/findings
          # Files up to 64 KiB, the maximum input length below.
          find tests/resources/ktx tests/resources/ktx2 -name '*.ktx*' -size -65k \
            -exec cp {} $FUZZ_BUILD_DIR/seeds/ \;
          $FUZZ_BUILD_DIR/${{ matrix.target }} -dict=tests/fuzz/ktx.dict -max_len=65536 \
            -max_total_time=600 -timeout=30 -rss_limit_mb=2560 -print_final_stats=1 \
            -artifact_prefix=$FUZZ_BUILD_DIR/findings/ \
            $FUZZ_BUILD_DIR/corpus $FUZZ_BUILD_DIR/seeds 2>&1 \
            | tee $FUZZ_BUILD_DIR/findings/fuzz.log

      - name: Name the findings for what they are
        if: failure() && steps.fuzz10.outcome == 'failure'
        working-directory: ${{ env.FUZZ_BUILD_DIR }}/findings
        run: |
          # libFuzzer names a finding crash-<sha1>, leak-, timeout-, oom- or
          # slow-unit-. Add the extension of the file it is.
          for f in crash-* leak-* timeout-* oom-* slow-unit-*; do
            [ -f "$f" ] || continue
            case $(head -c 12 "$f" | od -An -tx1 | tr -d ' \n') in
              ab4b5458203230bb0d0a1a0a) mv "$f" "$f.ktx2" ;;
              ab4b5458203131bb0d0a1a0a) mv "$f" "$f.ktx" ;;
              *) mv "$f" "$f.bin" ;;
            esac
          done
          cat > README.txt <<EOF
          These are inputs on which ${{ matrix.target }} failed, and fuzz.log,
          the log of the run with the report of the failure. To reproduce one,
          build the fuzz targets as tests/fuzz/README.md says and run

              UBSAN_OPTIONS=print_stacktrace=1 build/fuzz/${{ matrix.target }} <file>
          EOF

      - name: Upload findings
        if: failure() && steps.fuzz10.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: ${{ env.FUZZ_BUILD_DIR }}/findings/
