name: pyktx Wheels

# Build pyktx wheels for Linux and macOS with cibuildwheel. libktx is
# built first, then auditwheel (Linux) or delocate (macOS) copies it into
# each wheel so the wheels work without a separate libktx install. The
# Linux wheels have manylinux and musllinux tags which PyPI accepts.

# Seems no way to avoid duplicating this on logic in each .yml file.
# See https://github.com/actions/starter-workflows/issues/245.
on:
  # Trigger the workflow on a pull request,
  pull_request:

  push:
    # And on pushes to main, which will occur when a PR is merged.
    branches:
      - main
    # Also trigger on push of release tags to any branch. Useful
    # for testing release builds before merging to main.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
    paths-ignore:
      - .appveyor.yml
      - .github/workflows/android.yml
      - .github/workflows/check-determinism.yml
      - .github/workflows/check-libktx-only.yml
      - .github/workflows/check-mkvk.yml
      - .github/workflows/check-reuse.yml
      - .github/workflows/docs.yml
      - .github/workflows/formatting.yml
      - .github/workflows/linux.yml
      - .github/workflows/macos.yml
      - .github/workflows/mingw.yml
      - .github/workflows/publish-pyktx.yml
      - .github/workflows/manual.yml
      - .github/workflows/web.yml
      - .github/workflows/windows.yml
      - .travis.yml
      - README.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - LICENSE.md
      - LICENSES
      - RELEASE_NOTES.md
      - REUSE.toml
      - install-gitconfig*
  # Allow manual trigger
  workflow_dispatch:

jobs:
  pyktx:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: macos-15-intel
            # Most Intel Macs predate AVX2, the ASTC encoder's default.
            # Same as scripts/build_macos.sh.
            cmake_options: -DASTCENC_ISA_SSE41=ON
    name: pyktx wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Only the images used by the pyktx tests are pulled, below.
      GIT_LFS_SKIP_SMUDGE: 1
      # libktx is built for macOS 13.3. See CMAKE_OSX_DEPLOYMENT_TARGET
      # in the top level CMakeLists.txt.
      MACOSX_DEPLOYMENT_TARGET: '13.3'

    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch all history to make sure tags are
          # included (used for version creation)
          fetch-depth: 0

      - name: Force fetch provoking tag's annotation.
        # Work around https://github.com/actions/checkout/issues/290.
        if: github.ref_type == 'tag'
        run: git fetch -f origin ${{ github.ref }}:${{ github.ref }}

      - name: Pull test images
        run: git lfs pull --include=tests/resources/ktx,tests/resources/ktx2

      - name: Set pyktx version
        # Same tag cmake/version.cmake uses for KTX_VERSION_FULL.
        run: |
          KTX_VERSION=`git describe --abbrev=0 --match 'v[0-9]*'`
          echo "LIBKTX_VERSION=${KTX_VERSION#v}" >> $GITHUB_ENV

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.3.0
        with:
          package-dir: interface/python_binding
          output-dir: wheelhouse
        env:
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*
          CIBW_ARCHS: native
          CIBW_BEFORE_ALL: >
            cmake -S . -B build-pyktx -DCMAKE_BUILD_TYPE=Release
            -DKTX_FEATURE_TESTS=OFF -DKTX_FEATURE_TOOLS=OFF
            -DKTX_FEATURE_LOADTEST_APPS=OFF ${{ matrix.cmake_options }} &&
            cmake --build build-pyktx --parallel 4
          CIBW_ENVIRONMENT: >
            LIBKTX_INCLUDE_DIR=$(pwd)/lib/include
            DFDUTILS_INCLUDE_DIR=$(pwd)/external/dfdutils
            LIBKTX_LIB_DIR=$(pwd)/build-pyktx/Release
          CIBW_ENVIRONMENT_PASS_LINUX: LIBKTX_VERSION
          CIBW_TEST_COMMAND: python -m unittest discover -v -s {project}/interface/python_binding/tests

      - name: Upload artifact pyktx
        uses: actions/upload-artifact@v7
        with:
          name: pyktx-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          draft: true
          prerelease: true
          files: wheelhouse/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
