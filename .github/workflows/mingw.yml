name: MingW CI

# Seems no way to avoid duplicating this on logic in each .yml file.
# See https://github.com/actions/starter-workflows/issues/245.
on:
  # Trigger the workflow on a pull request,
  pull_request:

  push:
    # And on pushes to main, which will occur when a PR is merged.
    branches:
      - main
    # Also trigger on push of release tags to any branch. Useful
    # for testing release builds before merging to main.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
    paths-ignore:
      - .appveyor.yml
      - .github/workflows/android.yml
      - .github/workflows/check-determinism.yml
      - .github/workflows/check-libktx-only.yml
      - .github/workflows/check-mkvk.yml
      - .github/workflows/docs.yml
      - .github/workflows/formatting.yml
      - .github/workflows/linux.yml
      - .github/workflows/macos.yml
      - .github/workflows/publish-pyktx.yml
      - .github/workflows/manual.yml
      - .github/workflows/web.yml
      - .github/workflows/windows.yml
      - .travis.yml
      - README.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - LICENSE.md
      - LICENSES
      - RELEASE_NOTES.md
      - REUSE.toml
      - install-gitconfig*
      - vcpkg.json
      - vcpkg-configuration.json
  # Allow manual trigger
  workflow_dispatch:
  workflow_call:

jobs:
  mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # To avoid bandwidth charges skip downloading source and golden images
      # for texturetests etc., loadtests and legacy tool tests. They will be
      # pulled later as necessary
      GIT_LFS_SKIP_SMUDGE: 1
      WERROR: ON

    steps:
    - uses: actions/checkout@v6
      with:
        # Fetch all history to make sure tags are
        # included (used for version creation)
        fetch-depth: 0
    - name: GCC Version
      run: gcc --version # If this fails MINGW is not setup correctly
    - name: Force update provoking tag
      # Work around https://github.com/actions/checkout/issues/290.
      if: github.ref_type == 'tag'
      run: git fetch -f origin ${{ github.ref }}:${{ github.ref }}
    - name: Pull test images from Git LFS
      run: git lfs pull --include=tests/resources

    - name: Enable Core Dumps
      shell: pwsh
      run: |
        Get-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -ErrorAction Ignore
        Get-Item -Path "HKLM:SOFTWARE\Microsoft\Windows NT\CurrentVersion\AeDebug" -ErrorAction Ignore
        Get-ItemProperty -Path "HKLM:SOFTWARE\Microsoft\Windows NT\CurrentVersion\AeDebug" -Name "Auto" -ErrorAction Ignore
        echo "Setting Dump properties."
        # x86_64 runners have this, arm runner does not.
        New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" -Name "LocalDumps" -ErrorAction Ignore
        New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Name "DumpFolder" -Value "%LOCALAPPDATA%\CrashDumps" -PropertyType ExpandString
        New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Name "DumpCount" -Value 10 -PropertyType DWord
        Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Name "DumpFolder" -ErrorAction Ignore

    - name: Fetch CTS Submodule
      run: git submodule update --init --recursive tests/cts
    - name: Install Ninja
      run: choco install ninja --no-progress
    - name: Configure Mingw x64
      run: cmake -B build -G "Ninja Multi-Config" -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DKTX_FEATURE_TOOLS=TRUE -DKTX_FEATURE_TOOLS_CTS=TRUE -DKTX_WERROR=$WERROR
    - name: Build Mingw x64 Debug
      run: cmake --build build --config Debug -j $(nproc)
#    - name: Build Mingw x64 Release
#      run: cmake --build build --config Release -j $(nproc)

    - name: Install procdump
      run: choco install procdump -y

    - name: Extract test list to attempt to locate run failure
      id: extract_test_list
      run: |
        $dumproot = "$env:GITHUB_WORKSPACE\crashdumps"
        New-Item -ItemType Directory -Force -Path $dumpRoot | Out-Null
        procdump -accepteula -e -ma -x $dumproot -- build/Debug/unittests.exe --gtest_list_tests

    - name: Test Mingw build
      id: teststep
      run: ctest --output-on-failure --test-dir build -C Release -j $(nproc)

    - name: Upload generated CTS output files if CTS tests fail
      if: failure() && steps.teststep.outcome == 'failure'
      uses: actions/upload-artifact@v7
      with:
        name: cts_failure_artifacts_commit_sha_${{ github.sha }}
        path: tests/cts/clitests/output

    - name: ls DumpFolder if extracting test list fails
      if: failure() && steps.extract_test_list.outcome == 'failure'
      run: |
        localappdata=$(cygpath $LOCALAPPDATA)
        crashdumps=$localappdata/CrashDumps
        ls $localappdata
        if [ -d "$crashdumps" ]; then ls "$crashdumps"; else echo "No $crashdumps"; fi
        if [ -d "$localappdata/Microsoft/Windows/WER" ]; then ls "$localappdata/Microsoft/Windows/WER"; else echo "No $localappdata/Microsoft/Windows/WER"; fi
        if [ -d "$localappdata/Microsoft/Windows/WER/ReportArchive" ]; then ls "$localappdata/Microsoft/Windows/WER/ReportArchive"; else echo "No $localappdata/Microsoft/Windows/WER/ReportArchive"; fi
        if [ -d "/c/ProgramData/Microsoft/Windows/WER/ReportArchive" ]; then ls "/c/ProgramData/Microsoft/Windows/WER/ReportArchive"; else echo "No /c/ProgramData/Microsoft/Windows/WER/ReportArchive"; fi

    - name: Upload core dump if extracting test list fails
      if: failure() && steps.extract_test_list.outcome == 'failure'
      uses: actions/upload-artifact@v7
      with:
        name: extract_test_core_dump_sha_${{ github.sha }}
        path: ${{ env.LOCALAPPDATA }}/crashdumps/**
#        path: ${{ env.GITHUB_WORKSPACE }}/*.dmp
